name: Daily reminder

# Every evening, check LeetCode for an accepted submission today and send an
# ntfy push if there isn't one. Runs on GitHub's servers, so the PC can be off.
#
# Notes on the schedule:
# - Cron times are always UTC. Local time shifts by an hour when daylight
#   saving starts or ends (Chicago: CDT = UTC-5 in summer, CST = UTC-6 in winter).
# - GitHub may start scheduled runs 5-30 minutes late (more when it's busy),
#   so don't rely on the exact minute.
# - GitHub disables scheduled workflows after 60 days with no commits in a
#   public repo. Re-enable it from Actions tab -> "Daily reminder" ->
#   "Enable workflow" (see the README).

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 8:30pm CDT / 7:30pm CST
    - cron: "30 3 * * *"   # 03:30 UTC = 10:30pm CDT / 9:30pm CST (last call)
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
        description: "Send even if already solved (test phone setup)"

permissions:
  contents: read

# Never let two runs overlap (e.g. a late scheduled run and a manual one).
concurrency:
  group: daily-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME }}
      # A secret, because anyone who knows an ntfy.sh topic can read its messages.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TZ: ${{ vars.TZ || 'America/Chicago' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Check LeetCode and remind
        run: cd backend && python scripts/daily_check.py ${{ inputs.force && '--force' || '' }}
