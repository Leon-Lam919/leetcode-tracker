server {
    listen 80;

    # The React app. Unknown paths fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # API calls go to the backend container. No trailing slash on proxy_pass,
    # so "/api/stats" stays "/api/stats" (the backend's routes include /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sync can take a few seconds (two LeetCode attempts with a 10s timeout each).
        proxy_read_timeout 60s;
    }
}
