# Tool settings only. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
# Lets tests do `from main import app` without installing the package.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]
